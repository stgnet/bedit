{{define "content"}}
<main class="panel narrow">
  <h1>Log in</h1>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <p>There's no password. bedit remembers this browser with a cookie, and
  documents you import belong to you here.</p>
  <form method="post" action="{{.Prefix}}/_login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Your name <input type="text" name="name" maxlength="60" required autofocus></label>
    <button type="submit">Continue</button>
  </form>
</main>
{{end}}
